<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grok Bot">
  <title>Grok Bot desk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="desk-app-version" content="v5">
  <link rel="stylesheet" href="app.css?v=5">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="navbar" id="navbar">
      <button class="nav-btn avatar-btn" id="btn-avatar" type="button" aria-label="Account">
        <span class="avatar-dot" id="avatar-initials">DB</span>
      </button>
      <button class="nav-title-btn" id="btn-home-title" type="button">
        <span class="nav-status-dot" id="nav-status-dot"></span>
        <span>Grok Bot</span>
        <span class="chev">›</span>
      </button>
      <div class="nav-actions">
        <button class="nav-btn" id="btn-search" type="button" aria-label="Search">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="nav-btn bell-btn" id="btn-bell" type="button" aria-label="Alerts">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="bell-dot" id="bell-dot" hidden></span>
        </button>
      </div>
    </header>

    <div id="search-bar" class="search-bar" hidden>
      <input id="search-input" type="search" placeholder="Search name, symbol or mint" autocomplete="off" spellcheck="false">
      <button id="search-clear" class="text-btn" type="button">Done</button>
    </div>

    <div id="error-banner" class="error-banner" hidden></div>
    <div id="demo-banner" class="demo-banner" hidden>
      <span id="demo-banner-text">Example data · preview only</span>
      <button id="btn-exit-demo" class="pill-btn" type="button">Back to live</button>
    </div>
    <div id="install-hint" class="install-hint" hidden>Now tap Share → Add to Home Screen</div>

    <main id="view-root" class="view-root" aria-live="polite"></main>

    <nav class="tab-bar" id="tab-bar" aria-label="Main navigation">
      <button class="tab-btn active" data-tab="home" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </button>
      <button class="tab-btn" data-tab="desk" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 14h3M8 17h6"/></svg>
        <span>Desk</span>
      </button>
      <button class="tab-btn" data-tab="bots" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="6" width="16" height="12" rx="3"/><path d="M12 2v4M9 12h.01M15 12h.01"/></svg>
        <span>Bots</span>
      </button>
      <button class="tab-btn" data-tab="activity" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 12h4l2.5-6 3.5 12 2.5-6H20"/></svg>
        <span>Activity</span>
      </button>
      <button class="tab-btn" data-tab="account" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 14.5-4 16 0"/></svg>
        <span>Account</span>
      </button>
    </nav>
  </div>

  <!-- Full-screen Live Screen modal -->
  <div id="screen-modal" class="modal-overlay" hidden>
    <div class="modal-toolbar">
      <button id="screen-modal-close" class="pill-btn" type="button">Close</button>
      <div class="zoom-controls">
        <button id="zoom-out" class="pill-btn" type="button">−</button>
        <button id="zoom-reset" class="pill-btn" type="button">1×</button>
        <button id="zoom-in" class="pill-btn" type="button">+</button>
      </div>
      <a id="screen-modal-fomo" class="pill-btn accent-blue" target="_blank" rel="noopener noreferrer" hidden>Open on FOMO</a>
    </div>
    <div class="modal-stage" id="modal-stage">
      <img id="modal-img" alt="Bot screen full view">
      <div id="modal-placeholder" class="modal-placeholder" hidden>No screen frame captured yet</div>
    </div>
  </div>

  <!-- Bottom sheets (Sell / Live / Connect setup link) -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden>
    <div class="sheet" id="sheet-box" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js?v=5"></script>
</body>
</html>
